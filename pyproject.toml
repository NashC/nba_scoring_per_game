[project]
name = "nba-scoring-per-game"
version = "0.1.0"
description = "Event-level NBA player scoring pipeline built on official play-by-play data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nba_api>=1.11.4",
  "pandas>=2.2",
  "pyarrow>=23.0.0",
]

[project.scripts]
nba-scoring-per-game = "nba_scoring_per_game.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
