[project]
name = "nba-scoring-per-game"
version = "0.1.0"
description = "Event-level NBA player scoring pipeline built on official play-by-play data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nba_api>=1.11.4",
  "pandas>=2.2",
  "pyarrow>=23.0.0",
  "dash>=4.0.0",
  "plotly>=6.6.0",
  "diskcache>=5.6.3",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6,<8",
]

[project.scripts]
nba-scoring-per-game = "nba_scoring_per_game.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nba_scoring_per_game.dashboard" = ["assets/*.css", "assets/*.js", "assets/team_logos/*.svg"]

[tool.coverage.run]
branch = true
source = ["nba_scoring_per_game"]

[tool.coverage.report]
show_missing = true
skip_covered = false
